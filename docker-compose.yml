name: online-shop

# Connection settings shared by every container of the application.
x-app-environment: &app-environment
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-shop}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
  POSTGRES_DB: ${POSTGRES_DB:-shop}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
    ports:
      # Published on localhost only, and not on 5432 so it does not clash with a local PostgreSQL.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-off job: apply migrations (and load demo data into an empty database), then exit.
  # The API starts only after it has completed successfully.
  migrate:
    build:
      context: .
      target: runtime
    command: ["sh", "-c", "alembic upgrade head && python -m app.scripts.seed"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    environment: *app-environment
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Test suite against the same PostgreSQL image: `docker compose run --rm tests`.
  # It uses a separate database (<POSTGRES_DB>_test) that it creates and migrates itself.
  tests:
    build:
      context: .
      target: test
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

volumes:
  postgres-data: